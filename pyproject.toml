[build-system]
requires = ["setuptools>=58.0,<70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LWphotorates"
version = "1.0.0"
description = "Photoreaction rate calculations (H2, H- and H2+) given a stellar spectrum."
readme = "README.md"
requires-python = "<3.13"
license = { text = "MIT" }

authors = [
    { name = "Andrea Incatasciato", email = "andrea.incatasciato93@gmail.com" }
]

dependencies = [
    "frigus",
    "h5py",
    "astropy<4.3",
    "matplotlib",
    "numpy<1.23",
    "scipy",
    "xarray",
    "mpmath",
    "hoki",
    "ipykernel",
]

[tool.setuptools]
packages = ["LWphotorates"]